<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0614">
  <meta name="description" content="The baby Möbius Bar player: one big Play, a list, shuffle and repeat, glowing lights.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Möbius Bar Baby</title>
  <style>
    :root { color-scheme: dark; --red: #c1121f; --yel: #ffcc00; --blu: #0a4fd6; --ink: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #06030b; }
    body { display: grid; place-items: center; overflow: hidden; color: var(--ink);
      font: 600 16px/1.3 "Montserrat", "Helvetica Neue", Arial, sans-serif; text-transform: uppercase; letter-spacing: .05em;
      -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    /* fixed square stage: same picture on phone and computer */
    .stage { position: relative; width: min(100vw, 100vh); width: min(100vw, 100svh); aspect-ratio: 1;
      overflow: hidden; overflow: clip; container-type: size; background: #0b0614; isolation: isolate; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #bg { filter: blur(3cqw) saturate(1.2); transform: scale(1.12); }
    .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 40%, #0b0614b8 100%); pointer-events: none; }

    .rail { position: absolute; inset: 0 0 12cqw; display: flex; width: 200%; transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
    .rail.on2 { transform: translateX(-50%); }
    .page { position: relative; width: 50%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 6cqw 6cqw 2cqw; gap: 3cqw; }

    /* page 1: one big play */
    .big { margin: auto 0 0; width: 46cqw; height: 46cqw; border-radius: 50%; border: .8cqw solid #fff; cursor: pointer;
      background: radial-gradient(circle at 35% 30%, #ffffff55, #ffffff10 60%), #0b061470; color: #fff;
      display: grid; place-items: center; font: inherit; font-size: 7cqw; letter-spacing: .12em;
      box-shadow: 0 0 calc(6cqw + var(--p, 0) * 10cqw) var(--glow, #ffcc00), inset 0 0 4cqw #ffffff40;
      transform: scale(calc(1 + var(--p, 0) * .05)); }
    .big:active { transform: scale(.97); }
    .now { margin: 1cqw 0 auto; text-align: center; min-height: 12cqw; }
    .now b { display: block; font-size: 4.6cqw; text-shadow: 0 0 2cqw #000; max-width: 80cqw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .now small { font-size: 2.6cqw; letter-spacing: .3em; opacity: .85; text-shadow: 0 0 1.5cqw #000; }

    /* page 2: the list, shuffle, repeat */
    .head { width: 100%; display: flex; gap: 2.5cqw; }
    .tog { flex: 1; height: 10cqw; border-radius: 2.4cqw; font: inherit; font-size: 3.4cqw; color: #fff; cursor: pointer;
      background: #0b0614b0; border: 2px solid #ffffff70; }
    .tog[aria-pressed="true"] { background: linear-gradient(90deg, var(--red), #c98a00); border-color: #fff; box-shadow: 0 0 4cqw -1cqw var(--yel); }
    .list { width: 100%; flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 1.4cqw; padding: .5cqw; }
    .song { display: flex; align-items: center; gap: 2.5cqw; width: 100%; min-height: 9.5cqw; padding: 1.5cqw 3cqw; text-align: left;
      border-radius: 2.2cqw; border: 1px solid #ffffff40; background: #0b0614a8; color: #fff; font: inherit; font-size: 3.3cqw; cursor: pointer;
      text-transform: none; letter-spacing: .02em; }
    .song i { flex: 0 0 1cqw; align-self: stretch; border-radius: 1cqw; background: var(--c); box-shadow: 0 0 2cqw var(--c); }
    .song span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .song.on { border-color: #fff; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, #0b0614), #0b0614c0); }
    .song.on span::after { content: "  ♪"; }
    .empty { margin: auto; text-align: center; font-size: 3.2cqw; line-height: 1.5; text-transform: none; opacity: .9; text-shadow: 0 0 1cqw #000; }

    .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 12cqw; display: flex; justify-content: center; align-items: center; gap: 3cqw; }
    .nav button { height: 7.5cqw; padding: 0 5cqw; border-radius: 5cqw; font: inherit; font-size: 3.2cqw; color: #fff; cursor: pointer;
      background: transparent; border: 2px solid transparent; }
    .nav button[aria-current="true"] { background: #ffffff2e; border-color: #fff; }

    /* MADE BY OVI badge: draggable, glowing; tap opens the About page */
    .badge { position: fixed; right: 12px; bottom: 12px; z-index: 20; padding: 9px 24px; font: 800 11px/1 "Montserrat", Arial, sans-serif;
      letter-spacing: .2em; color: #fff; text-shadow: 0 1px 1px #000c; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
      animation: glow 3s ease-in-out infinite alternate; }
    .badge::before { content: ""; position: absolute; inset: 0; z-index: -1;
      clip-path: polygon(0 50%, 15px 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 15px 100%);
      background: linear-gradient(180deg, #ffffff70, #fff0 52%, #00000040), linear-gradient(90deg, #c1121f, #c98a00, #0a4fd6, #7b1e2e, #c1121f) 0 0 / 300% 100%;
      animation: shimmer 14s linear infinite; }
    @keyframes shimmer { to { background-position: 300% 0; } }
    @keyframes glow { from { filter: drop-shadow(0 0 3px #ffcc0088); } to { filter: drop-shadow(0 0 8px #ff3b30cc) drop-shadow(0 0 16px #0a84ff88); } }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="shade"></div>

    <div class="rail">
      <section class="page" aria-label="Play">
        <button class="big" type="button" aria-label="Play">PLAY</button>
        <p class="now"><b>Möbius Bar</b><small>the main bar of the world</small></p>
      </section>
      <section class="page" aria-label="Songs">
        <div class="head">
          <button class="tog shuffle" type="button" aria-pressed="false">⫮ Shuffle</button>
          <button class="tog repeat" type="button" aria-pressed="false">↻ Repeat</button>
        </div>
        <div class="list"></div>
        <p class="empty" hidden></p>
      </section>
    </div>

    <nav class="nav">
      <button type="button" data-p="0" aria-current="true">Play</button>
      <button type="button" data-p="1" aria-current="false">Songs</button>
    </nav>
    <audio class="player" preload="metadata" crossorigin="anonymous"></audio>
  </main>

  <div class="badge" role="note" aria-label="Made by Ovi">MADE BY OVI</div>

  <script type="application/json" id="about">
{
  "title": "Möbius Bar Baby",
  "tagline": "The little one of the Möbius Bar player. One big Play, a list of songs, Shuffle and Repeat, and lights that glow with the music on one square stage.",
  "sections": [
    { "h": "What it is", "p": [
      "Page one is a single glowing PLAY button. Page two is the song list with Shuffle and Repeat.",
      "The lights choose their own moods: colours, lava, disco beams and rays change by themselves every so often. No knobs, just the glow."
    ] },
    { "h": "Where the songs come from", "p": [
      "The baby plays every MP3 in the big player's audio folder on GitHub. Add a song there and it shows up here on its own."
    ] },
    { "h": "How it was made", "p": [
      "Concept, design and direction: Ovi Demetrian. Colours from his own Winamp skins: red, yellow and blue drifting into orange and dark red.",
      "Built with Claude (Anthropic): one HTML file, the lights drawn on canvas, the beat read by the Web Audio analyser. Installable as an app from the home screen."
    ] }
  ],
  "links": [
    { "label": "The big Möbius Bar player", "url": "../" },
    { "label": "Ovi on GitHub", "url": "https://github.com/ovidemetrian" }
  ],
  "credit": "Concept &amp; design: <b>Ovi Demetrian<\/b> · built with Claude"
}
  </script>
  <script src="../about.js" defer></script>

  <script>
  "use strict";
  const $ = s => document.querySelector(s);
  const player = $(".player"), big = $(".big"), list = $(".list"), empty = $(".empty");
  const nowB = $(".now b"), nowS = $(".now small"), rail = $(".rail"), stage = $(".stage");
  const shuffleBtn = $(".shuffle"), repeatBtn = $(".repeat");
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

  // ── Songs: every MP3 in the big player's audio folder ────────────
  const REPO = "ovidemetrian/MOBIUS-BAR-PLAY-THE-LAMP";
  const SITE = new URL("../audio/", location.href).href;
  const COLORS = ["#c1121f", "#c98a00", "#0a4fd6", "#e0661a", "#7b1e2e"];
  let songs = [], cur = -1;
  const state = Object.assign({ shuffle: false, repeat: false }, store.get("mobius-baby.state", {}));
  const titleOf = name => name.replace(/\.mp3$/i, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim();

  async function loadSongs() {
    let files = null;
    try {
      const r = await fetch("https://api.github.com/repos/" + REPO + "/contents/audio", { headers: { Accept: "application/vnd.github+json" } });
      if (r.ok) files = (await r.json()).filter(f => f.type === "file" && /\.mp3$/i.test(f.name)).map(f => f.name);
    } catch {}
    if (files) store.set("mobius-baby.files", files); else files = store.get("mobius-baby.files", []);
    files.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" }));
    songs = files.map((name, i) => ({ name, title: titleOf(name), src: SITE + encodeURIComponent(name), color: COLORS[i % COLORS.length] }));
    renderList();
  }

  function renderList() {
    list.replaceChildren(...songs.map((s, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "song"; b.style.setProperty("--c", s.color);
      b.innerHTML = "<i></i><span></span>"; b.querySelector("span").textContent = s.title;
      b.addEventListener("click", () => play(i));
      return b;
    }));
    empty.hidden = songs.length > 0;
    empty.textContent = "No songs yet. Upload MP3s to the audio folder of MOBIUS-BAR-PLAY-THE-LAMP on GitHub and they appear here.";
    mark();
  }
  function mark() {
    [...list.children].forEach((el, i) => el.classList.toggle("on", i === cur));
    big.textContent = player.paused ? "PLAY" : "PAUSE";
    big.setAttribute("aria-label", player.paused ? "Play" : "Pause");
    if (cur >= 0) { nowB.textContent = songs[cur].title; nowS.textContent = (cur + 1) + " of " + songs.length; }
  }

  // ── Playback ─────────────────────────────────────────────────────
  let actx = null, an = null;
  const freq = new Uint8Array(256);
  function graph() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const s = actx.createMediaElementSource(player);
        an = actx.createAnalyser(); an.fftSize = 512; an.smoothingTimeConstant = .8;
        s.connect(an); an.connect(actx.destination);
      } catch { actx = null; an = null; }
    }
    if (actx && actx.state === "suspended") actx.resume().catch(() => {});
  }
  function play(i) {
    if (!songs.length) { go(1); return; }
    graph();
    cur = (i + songs.length) % songs.length;
    player.src = songs[cur].src;
    player.play().catch(() => {});
    mark();
  }
  function next(step = 1) {
    if (!songs.length) return;
    if (state.shuffle && songs.length > 1) { let n; do { n = Math.floor(Math.random() * songs.length); } while (n === cur); play(n); }
    else play(cur + step);
  }
  big.addEventListener("click", () => {
    graph();
    if (cur < 0) { play(state.shuffle ? Math.floor(Math.random() * songs.length) : 0); return; }
    if (player.paused) player.play().catch(() => {}); else player.pause();
  });
  player.addEventListener("play", mark);
  player.addEventListener("pause", mark);
  player.addEventListener("ended", () => { if (state.repeat) { player.currentTime = 0; player.play().catch(() => {}); } else next(1); });
  player.addEventListener("error", () => { if (cur >= 0 && songs.length > 1) setTimeout(() => next(1), 800); });

  function renderToggles() {
    shuffleBtn.setAttribute("aria-pressed", String(state.shuffle));
    repeatBtn.setAttribute("aria-pressed", String(state.repeat));
    store.set("mobius-baby.state", state);
  }
  shuffleBtn.addEventListener("click", () => { state.shuffle = !state.shuffle; renderToggles(); });
  repeatBtn.addEventListener("click", () => { state.repeat = !state.repeat; renderToggles(); });
  if ("mediaSession" in navigator) {
    const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    set("play", () => player.play()); set("pause", () => player.pause());
    set("nexttrack", () => next(1)); set("previoustrack", () => next(-1));
  }

  // ── Pages: Play | Songs ──────────────────────────────────────────
  const navBtns = [...document.querySelectorAll(".nav button")];
  function go(p) { rail.classList.toggle("on2", p === 1); navBtns.forEach((b, i) => b.setAttribute("aria-current", String(i === p))); }
  navBtns.forEach(b => b.addEventListener("click", () => go(+b.dataset.p)));
  stage.addEventListener("scroll", () => { stage.scrollLeft = 0; stage.scrollTop = 0; });   // focus must never shift the square
  let sx = null;
  stage.addEventListener("pointerdown", e => { sx = [e.clientX, e.clientY]; });
  stage.addEventListener("pointerup", e => {
    if (!sx) return; const dx = e.clientX - sx[0], dy = e.clientY - sx[1]; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : 0);
  });

  // ── Lights: they pick their own moods ────────────────────────────
  // Ovi's skin colours: red, yellow and blue; the blue drifts into dark orange and red; dark red for elegance.
  const MOODS = [
    { pal: [[193, 18, 31], [255, 204, 0], [10, 79, 214], [224, 102, 26]], rays: 1, beams: 0, speed: .35 },   // Ovi skin
    { pal: [[255, 45, 40], [255, 206, 0], [255, 110, 0], [150, 70, 255]], rays: 0, beams: 0, speed: .45 },   // lava
    { pal: [[255, 45, 40], [255, 206, 0], [170, 80, 255], [10, 120, 255]], rays: 0, beams: 1, speed: .8 },   // disco
    { pal: [[123, 30, 46], [193, 18, 31], [201, 138, 0], [60, 20, 40]], rays: 1, beams: 0, speed: .22 },     // dark red, elegant
    { pal: [[255, 0, 130], [180, 90, 255], [255, 225, 60], [0, 215, 255]], rays: 0, beams: 1, speed: .6 },   // neon
    { pal: [[255, 175, 60], [255, 105, 50], [130, 70, 170], [40, 60, 150]], rays: 1, beams: 0, speed: .15 }  // candle
  ];
  const bg = $("#bg"), bx = bg.getContext("2d"), fx = $("#fx"), fxc = fx.getContext("2d");
  let W = 1, H = 1, dpr = 1;
  function size() {
    const r = stage.getBoundingClientRect(); dpr = Math.min(1.5, devicePixelRatio || 1);
    W = fx.width = Math.round(r.width * dpr); H = fx.height = Math.round(r.height * dpr);
    bg.width = 160; bg.height = 160;
  }
  new ResizeObserver(size).observe(stage); size();

  const lerp = (a, b, t) => a + (b - a) * t, sm = t => t * t * (3 - 2 * t);
  const rgba = (c, a) => "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + Math.max(0, Math.min(1, a)).toFixed(3) + ")";
  let from = MOODS[0], to = MOODS[0], blendAt = -99, moodAt = 0, nextIn = 25;
  const seeds = Array.from({ length: 8 }, () => [Math.random(), Math.random(), Math.random(), Math.random()]);
  let clock = 0, last = performance.now() / 1000, ph = 0, cph = 0, rot = 0, pulse = 0, level = 0, bassAvg = 0, lastBeat = 0;

  function color(x) {
    const t = sm(Math.min(1, (clock - blendAt) / 4));
    const pick = (pal) => { const n = pal.length, xx = ((x % n) + n) % n, i = Math.floor(xx), f = sm(xx - i), a = pal[i], b = pal[(i + 1) % n];
      return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f)]; };
    const a = pick(from.pal), b = pick(to.pal);
    return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  }
  function frame(ms) {
    const now = ms / 1000, dt = Math.min(.1, now - last); last = now; clock += dt;
    if (clock - moodAt > nextIn) {   // a new mood, all by itself
      moodAt = clock; nextIn = 20 + Math.random() * 25;
      let m; do { m = MOODS[Math.floor(Math.random() * MOODS.length)]; } while (m === to);
      from = to; to = m; blendAt = clock;
    }
    const t = sm(Math.min(1, (clock - blendAt) / 4));
    const live = an && !player.paused && actx && actx.state === "running";
    if (live) {
      an.getByteFrequencyData(freq);
      let s = 0; for (let i = 0; i < freq.length; i++) s += freq[i];
      level = lerp(level, s / freq.length / 255, .2);
      let bass = 0; for (let i = 1; i < 6; i++) bass += freq[i]; bass /= 5;
      if (bass > bassAvg * 1.18 + 6 && bass > 90 && clock - lastBeat > .24) { pulse = 1; lastBeat = clock; }
      bassAvg = bassAvg * .93 + bass * .07;
    } else { level = lerp(level, .18, .05); pulse = Math.max(pulse, .25 * (.5 + .5 * Math.sin(clock * 1.5))); }
    pulse *= Math.pow(.05, dt);
    const speed = lerp(from.speed, to.speed, t);
    ph += dt * speed * (1 + pulse * .4); cph += dt * .05; rot += dt * (.12 + level * .6 + pulse * .8);

    // soft colour field
    bx.globalCompositeOperation = "source-over"; bx.fillStyle = "#0b0614"; bx.fillRect(0, 0, 160, 160);
    bx.globalCompositeOperation = "screen";
    seeds.forEach((s, i) => {
      const x = (.5 + .42 * Math.sin(ph * (.2 + .15 * s[0]) + s[1] * 6.28)) * 160, y = (.5 + .42 * Math.cos(ph * (.17 + .15 * s[2]) + s[3] * 6.28)) * 160;
      const r = 160 * (.28 + .06 * Math.sin(ph + i) + pulse * .08 + level * .12), c = color(i * .7 + cph);
      const g = bx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(c, .95)); g.addColorStop(1, rgba(c, 0));
      bx.fillStyle = g; bx.fillRect(x - r, y - r, r * 2, r * 2);
    });

    // rays and beams
    fxc.clearRect(0, 0, W, H); fxc.globalCompositeOperation = "lighter";
    const rays = lerp(from.rays, to.rays, t) * .6 + .4;   // slow rays always there, stronger in some moods
    const cx = W / 2, cy = H * .42, len = Math.hypot(W, H) * .8;
    for (let k = 0; k < 12; k++) {
      const a = rot + k / 12 * 6.283, sp = .06 + .02 * Math.sin(ph * .3 + k);
      const g = fxc.createRadialGradient(cx, cy, 0, cx, cy, len); const c = color(k * .5 + cph * 1.3);
      g.addColorStop(0, rgba(c, .14 * rays * (.7 + pulse))); g.addColorStop(1, rgba(c, 0));
      fxc.fillStyle = g; fxc.beginPath(); fxc.moveTo(cx, cy); fxc.arc(cx, cy, len, a - sp, a + sp); fxc.closePath(); fxc.fill();
    }
    const beams = lerp(from.beams, to.beams, t);
    if (beams > .02) [.15, .4, .6, .85].forEach((sx, k) => {
      const a = Math.PI / 2 + .5 * Math.sin(ph * .6 * (1 + k * .2) + k * 1.7), x0 = sx * W, L = H * 1.5, sp = .05 + .03 * pulse;
      const g = fxc.createRadialGradient(x0, 0, 0, x0, 0, L), c = color(k * 1.3 + cph * 2);
      g.addColorStop(0, rgba(c, .32 * beams * (.5 + pulse))); g.addColorStop(1, rgba(c, 0));
      fxc.fillStyle = g; fxc.beginPath(); fxc.moveTo(x0, 0); fxc.arc(x0, 0, L, a - sp, a + sp); fxc.closePath(); fxc.fill();
    });
    fxc.globalCompositeOperation = "source-over";

    const glow = color(cph * 2);
    big.style.setProperty("--p", pulse.toFixed(3));
    big.style.setProperty("--glow", rgba(glow, .9));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ── MADE BY OVI badge: drag it anywhere (a short tap opens About) ─
  const badge = $(".badge"); let drag = null;
  const place = (x, y) => { const r = badge.getBoundingClientRect();
    Object.assign(badge.style, { left: Math.min(Math.max(4, x), innerWidth - r.width - 4) + "px", top: Math.min(Math.max(4, y), innerHeight - r.height - 4) + "px", right: "auto", bottom: "auto" }); };
  const saved = store.get("mobius-baby.badge", null); if (saved) place(saved.x, saved.y);
  badge.addEventListener("pointerdown", e => { const r = badge.getBoundingClientRect(); drag = { dx: e.clientX - r.left, dy: e.clientY - r.top }; badge.setPointerCapture(e.pointerId); });
  badge.addEventListener("pointermove", e => { if (drag) place(e.clientX - drag.dx, e.clientY - drag.dy); });
  const end = () => { if (!drag) return; drag = null; const r = badge.getBoundingClientRect(); store.set("mobius-baby.badge", { x: r.left, y: r.top }); };
  badge.addEventListener("pointerup", end); badge.addEventListener("pointercancel", end);

  renderToggles();
  loadSongs();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  </script>
</body>
</html>
