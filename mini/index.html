<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0614">
  <meta name="description" content="The Möbius Bar mini player: your own songs from your phone, a glowing wave and lights, and a one-tap video for YouTube.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Möbius Bar Mini Player</title>
  <style>
    :root { color-scheme: dark; --red: #c1121f; --yel: #ffcc00; --blu: #0a4fd6; --ink: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #06030b; }
    body { display: grid; place-items: center; overflow: hidden; color: var(--ink);
      font: 600 16px/1.3 "Montserrat", "Helvetica Neue", Arial, sans-serif; text-transform: uppercase; letter-spacing: .05em;
      -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    button { font: inherit; color: #fff; cursor: pointer; }

    /* fixed square stage: same picture on phone and computer */
    .stage { position: relative; width: min(100vw, 100vh); width: min(100vw, 100svh); aspect-ratio: 1;
      overflow: hidden; overflow: clip; container-type: size; background: #0b0614; isolation: isolate; }
    canvas.layer { position: absolute; inset: 0; width: 100%; height: 100%; }
    #bg { filter: blur(3cqw) saturate(1.2); transform: scale(1.12); }
    .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 40%, #0b0614b8 100%); pointer-events: none; }

    .rail { position: absolute; inset: 0 0 12cqw; display: flex; width: 300%; transition: transform .55s cubic-bezier(.2, .8, .2, 1); transform: translateX(calc(var(--p, 0) * -100% / 3)); }
    .page { position: relative; width: calc(100% / 3); height: 100%; display: flex; flex-direction: column; align-items: center; padding: 6cqw 6cqw 2cqw; gap: 3cqw; }

    /* page 1: one big play, the wave lives under it (drawn on the canvas) */
    .big { margin-top: 2cqw; width: 42cqw; height: 42cqw; border-radius: 50%; border: .8cqw solid #fff; position: relative; flex: 0 0 auto;
      background: radial-gradient(circle at 35% 30%, #ffffff55, #ffffff10 60%), #0b061470;
      display: grid; place-items: center; font-size: 6.5cqw; letter-spacing: .12em; line-height: 1.15; text-align: center;
      box-shadow: 0 0 calc(6cqw + var(--pl, 0) * 10cqw) var(--glow, #ffcc00), inset 0 0 4cqw #ffffff40;
      transform: scale(calc(1 + var(--pl, 0) * .05)); }
    .big:active { transform: scale(.97); }
    .big small { display: block; font-size: 2.6cqw; letter-spacing: .2em; opacity: .85; }
    .ring { position: absolute; inset: -2.6cqw; width: calc(100% + 5.2cqw); height: calc(100% + 5.2cqw); transform: rotate(-90deg); pointer-events: none; overflow: visible; }
    .ring circle { fill: none; stroke-width: 1.4; }
    .ring .track { stroke: #ffffff26; }
    .ring .done { stroke: var(--glow, #ffcc00); stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
    .row { display: flex; align-items: center; gap: 3cqw; }
    .skip { width: 10cqw; height: 10cqw; border-radius: 50%; border: 2px solid #ffffff60; background: #0b061480; font-size: 4cqw; display: grid; place-items: center; }
    .skip:active { transform: scale(.92); }
    .now { margin: 0; text-align: center; width: 56cqw; }
    .now b { display: block; font-size: 4.4cqw; text-shadow: 0 0 2cqw #000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .now small { display: block; font-size: 2.5cqw; letter-spacing: .25em; opacity: .85; text-shadow: 0 0 1.5cqw #000; }

    /* page 2: your songs */
    .head { width: 100%; display: flex; gap: 2cqw; }
    .tog { flex: 1; height: 10cqw; border-radius: 2.4cqw; font-size: 3.1cqw; background: #0b0614b0; border: 2px solid #ffffff70; }
    .tog.add { background: linear-gradient(90deg, var(--red), #c98a00); border-color: #fff; }
    .tog[aria-pressed="true"] { background: linear-gradient(90deg, var(--blu), #6a1fb0); border-color: #fff; box-shadow: 0 0 4cqw -1cqw var(--yel); }
    .list { width: 100%; flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 1.4cqw; padding: .5cqw; }
    .song { flex: 0 0 auto; display: flex; align-items: center; gap: 2.5cqw; width: 100%; min-height: 10cqw; padding: 1.5cqw 1.5cqw 1.5cqw 3cqw;
      border-radius: 2.2cqw; border: 1px solid #ffffff40; background: #0b0614a8; font-size: 3.3cqw; text-transform: none; letter-spacing: .02em; }
    .song i { flex: 0 0 1cqw; align-self: stretch; border-radius: 1cqw; background: var(--c); box-shadow: 0 0 2cqw var(--c); }
    .song .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; background: none; border: 0; padding: 1.5cqw 0; font-size: inherit; text-transform: none; }
    .song .x { flex: 0 0 auto; width: 7.5cqw; height: 7.5cqw; border-radius: 50%; background: #ffffff14; border: 1px solid #ffffff40; font-size: 3.4cqw; }
    .song.on { border-color: #fff; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, #0b0614), #0b0614c0); }
    .song.on .t::after { content: "  ♪"; }
    .hint { margin: auto; text-align: center; font-size: 3.2cqw; line-height: 1.6; text-transform: none; letter-spacing: .02em; text-shadow: 0 0 1cqw #000; }
    .count { margin: 0; font-size: 2.4cqw; letter-spacing: .25em; opacity: .75; text-shadow: 0 0 1cqw #000; }

    /* page 3: save a video */
    h2 { margin: 0; font-size: 5cqw; letter-spacing: .14em; text-shadow: 0 0 2cqw #000; }
    .vsong { margin: -1.5cqw 0 0; font-size: 3cqw; opacity: .9; text-transform: none; text-align: center; max-width: 84cqw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 0 1cqw #000; }
    .shapes { display: flex; gap: 4cqw; align-items: flex-end; }
    .shape { display: flex; flex-direction: column; align-items: center; gap: 1.6cqw; padding: 3cqw; border-radius: 3cqw; background: #0b0614b8; border: 2px solid #ffffff70; font-size: 3cqw; }
    .shape:active { transform: scale(.96); }
    .shape span { display: block; border: .6cqw solid #fff; border-radius: 1.2cqw; box-shadow: 0 0 3cqw -.5cqw var(--yel), inset 0 0 3cqw #ffffff30;
      background: linear-gradient(135deg, #c1121f99, #c98a0099 45%, #0a4fd699); }
    .shape.h span { width: 32cqw; height: 18cqw; }
    .shape.v span { width: 15cqw; height: 26.7cqw; }
    .shape small { font-size: 2.3cqw; letter-spacing: .18em; opacity: .8; }
    .rec { display: flex; flex-direction: column; align-items: center; gap: 3cqw; margin: auto 0; }
    .rec b { font-size: 6cqw; letter-spacing: .1em; font-variant-numeric: tabular-nums; text-shadow: 0 0 2cqw #000; }
    .rec b::before { content: "● "; color: #ff2d28; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    .act { min-width: 46cqw; height: 11cqw; border-radius: 6cqw; font-size: 3.6cqw; letter-spacing: .12em; border: 2px solid #fff;
      background: linear-gradient(90deg, var(--red), #c98a00); box-shadow: 0 0 5cqw -1cqw var(--yel); }
    .act.blue { background: linear-gradient(90deg, var(--blu), #6a1fb0); }
    .vnote { margin: 0; font-size: 2.5cqw; line-height: 1.5; text-transform: none; letter-spacing: .02em; text-align: center; opacity: .9; text-shadow: 0 0 1cqw #000; max-width: 84cqw; }
    .recdot { position: absolute; top: 3cqw; left: 3cqw; z-index: 5; padding: 1cqw 2.4cqw; border-radius: 4cqw; background: #000a; font-size: 2.6cqw; letter-spacing: .15em; }
    .recdot::before { content: "● "; color: #ff2d28; animation: blink 1s steps(2) infinite; }

    .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 12cqw; display: flex; justify-content: center; align-items: center; gap: 2cqw; }
    .nav button { height: 7.5cqw; padding: 0 4.5cqw; border-radius: 5cqw; font-size: 3.2cqw; background: transparent; border: 2px solid transparent; }
    .nav button[aria-current="true"] { background: #ffffff2e; border-color: #fff; }

    /* MADE BY OVI badge: draggable, glowing; tap opens the About page */
    .badge { position: fixed; right: 12px; bottom: 12px; z-index: 20; padding: 9px 24px; font: 800 11px/1 "Montserrat", Arial, sans-serif;
      letter-spacing: .2em; color: #fff; text-shadow: 0 1px 1px #000c; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
      animation: glow 3s ease-in-out infinite alternate; }
    .badge::before { content: ""; position: absolute; inset: 0; z-index: -1;
      clip-path: polygon(0 50%, 15px 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 15px 100%);
      background: linear-gradient(180deg, #ffffff70, #fff0 52%, #00000040), linear-gradient(90deg, #c1121f, #c98a00, #0a4fd6, #7b1e2e, #c1121f) 0 0 / 300% 100%;
      animation: shimmer 14s linear infinite; }
    @keyframes shimmer { to { background-position: 300% 0; } }
    @keyframes glow { from { filter: drop-shadow(0 0 3px #ffcc0088); } to { filter: drop-shadow(0 0 8px #ff3b30cc) drop-shadow(0 0 16px #0a84ff88); } }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="bg" class="layer" aria-hidden="true"></canvas>
    <canvas id="fx" class="layer" aria-hidden="true"></canvas>
    <div class="shade"></div>
    <p class="recdot" hidden>REC</p>

    <div class="rail">
      <section class="page" aria-label="Play">
        <button class="big" type="button" aria-label="Add songs"><span class="bigt">ADD<br>SONGS<small>from your phone</small></span>
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="48"/><circle class="done" cx="50" cy="50" r="48" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
        </button>
        <div class="row">
          <button class="skip prev" type="button" aria-label="Previous song">‹</button>
          <p class="now"><b>Möbius Bar</b><small>mini player</small></p>
          <button class="skip nxt" type="button" aria-label="Next song">›</button>
        </div>
      </section>

      <section class="page" aria-label="Songs">
        <div class="head">
          <button class="tog add" type="button">＋ Add</button>
          <button class="tog shuffle" type="button" aria-pressed="false">🔀 Shuffle</button>
          <button class="tog repeat" type="button" aria-pressed="false">🔁 Repeat</button>
        </div>
        <div class="list"></div>
        <p class="hint">No songs yet.<br>Tap ＋ Add and pick songs from your phone.<br>They stay here for next time.</p>
        <p class="count"></p>
      </section>

      <section class="page" aria-label="Video">
        <h2>Save a video</h2>
        <p class="vsong">Pick a song first</p>
        <div class="pick">
          <div class="shapes">
            <button class="shape h" type="button" data-shape="h"><span></span>Horizontal<small>YouTube 16:9</small></button>
            <button class="shape v" type="button" data-shape="v"><span></span>Vertical<small>Shorts 9:16</small></button>
          </div>
        </div>
        <div class="rec" hidden>
          <b class="rect">0:00</b>
          <button class="act stop" type="button">Stop &amp; keep</button>
        </div>
        <div class="done-box rec" hidden>
          <button class="act save" type="button">Save video</button>
          <button class="act blue again" type="button">Make another</button>
        </div>
        <p class="vnote">The song plays from the start and the video records the whole song, lights and wave included. Keep the screen on until it finishes.</p>
      </section>
    </div>

    <nav class="nav">
      <button type="button" data-p="0" aria-current="true">Play</button>
      <button type="button" data-p="1" aria-current="false">Songs</button>
      <button type="button" data-p="2" aria-current="false">Video</button>
    </nav>
    <audio class="player" preload="auto"></audio>
    <input class="picker" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac" multiple hidden>
  </main>

  <div class="badge" role="note" aria-label="Made by Ovi">MADE BY OVI</div>

  <script type="application/json" id="about">
{
  "title": "Möbius Bar Mini Player",
  "tagline": "Your own songs, the Möbius Bar lights and a glowing wave, and a one-tap video of the song for YouTube, on one square stage.",
  "sections": [
    { "h": "What it is", "p": [
      "It opens empty. Add songs from your phone and they stay in the player for next time, on your phone only.",
      "Play shows a big glowing button and a live wave that moves with the music. The lights pick their own moods."
    ] },
    { "h": "Making a video", "p": [
      "On the Video page choose Horizontal (16:9, YouTube) or Vertical (9:16, Shorts). The song plays from the start and the whole song is recorded with the lights, the wave and its title.",
      "When it ends, tap Save video. iPhone saves MP4; most Android phones save WebM, which YouTube accepts."
    ] },
    { "h": "How it was made", "p": [
      "Concept, design and direction: Ovi Demetrian.",
      "Built with Claude (Anthropic): one HTML file, the lights and wave drawn on canvas from the Web Audio analyser, the video recorded in the browser. Installable as an app from the home screen."
    ] }
  ],
  "links": [
    { "label": "The big Möbius Bar player", "url": "../" },
    { "label": "Ovi on GitHub", "url": "https://github.com/ovidemetrian" }
  ],
  "credit": "Concept &amp; design: <b>Ovi Demetrian<\/b> · built with Claude"
}
  </script>
  <script src="../about.js" defer></script>

  <script>
  "use strict";
  const $ = s => document.querySelector(s);
  const player = $(".player"), big = $(".big"), bigT = $(".bigt"), ringDone = $(".ring .done"), picker = $(".picker");
  const list = $(".list"), hint = $(".hint"), countEl = $(".count"), nowB = $(".now b"), nowS = $(".now small");
  const rail = $(".rail"), stage = $(".stage"), shuffleBtn = $(".shuffle"), repeatBtn = $(".repeat");
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const COLORS = ["#c1121f", "#c98a00", "#0a4fd6", "#e0661a", "#6a1fb0", "#1e8f3e"];
  const state = Object.assign({ shuffle: false, repeat: false }, store.get("mobius-mini.state", {}));
  let songs = [], cur = -1, page = 0;

  // ── Songs from the phone, kept in this browser (IndexedDB) ─────────
  const DB = new Promise(res => {
    try {
      const r = indexedDB.open("mobius-mini", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("songs", { keyPath: "id", autoIncrement: true });
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch { res(null); }
  });
  const tx = async (mode, fn) => { const db = await DB; if (!db) return null;
    return new Promise(res => { const t = db.transaction("songs", mode), s = t.objectStore("songs"); const q = fn(s); t.oncomplete = () => res(q && q.result); t.onerror = () => res(null); }); };
  const titleOf = n => n.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 80) || "Untitled";

  async function loadSaved() {
    const rows = await tx("readonly", s => s.getAll()) || [];
    songs = rows.map(r => ({ id: r.id, title: r.title, blob: r.blob, url: null }));
    render();
  }
  async function addFiles(files) {
    for (const f of files) {
      const row = { title: titleOf(f.name), blob: f };
      const id = await tx("readwrite", s => s.add(row));
      songs.push({ id: id == null ? "t" + Math.random() : id, title: row.title, blob: f, url: null });
    }
    render();
    if (cur < 0 && songs.length) play(songs.length - files.length);
  }
  async function removeSong(i) {
    const s = songs[i];
    if (s.id != null && typeof s.id === "number") await tx("readwrite", st => st.delete(s.id));
    if (s.url) URL.revokeObjectURL(s.url);
    if (i === cur) { player.pause(); player.removeAttribute("src"); player.load(); cur = -1; }
    else if (i < cur) cur--;
    songs.splice(i, 1);
    render();
  }
  const srcOf = s => s.url || (s.url = URL.createObjectURL(s.blob));

  function render() {
    list.replaceChildren(...songs.map((s, i) => {
      const row = document.createElement("div");
      row.className = "song"; row.style.setProperty("--c", COLORS[i % COLORS.length]);
      row.innerHTML = '<i></i><button class="t" type="button"></button><button class="x" type="button">✕</button>';
      const t = row.querySelector(".t"); t.textContent = s.title; t.addEventListener("click", () => play(i));
      const x = row.querySelector(".x"); x.setAttribute("aria-label", "Remove " + s.title); x.addEventListener("click", () => removeSong(i));
      return row;
    }));
    hint.hidden = songs.length > 0;
    countEl.textContent = songs.length ? songs.length + (songs.length === 1 ? " song" : " songs") + " on this phone" : "";
    mark();
  }
  function mark() {
    [...list.children].forEach((el, i) => el.classList.toggle("on", i === cur));
    if (!songs.length) { bigT.innerHTML = "ADD<br>SONGS<small>from your phone</small>"; big.setAttribute("aria-label", "Add songs"); }
    else { bigT.textContent = player.paused ? "PLAY" : "PAUSE"; big.setAttribute("aria-label", player.paused ? "Play" : "Pause"); }
    if (cur >= 0 && songs[cur]) {
      nowB.textContent = songs[cur].title; nowS.textContent = (cur + 1) + " of " + songs.length;
      $(".vsong").textContent = songs[cur].title;
      if ("mediaSession" in navigator && window.MediaMetadata) try { navigator.mediaSession.metadata = new MediaMetadata({ title: songs[cur].title, artist: "Möbius Bar", album: "Mini Player",
        artwork: [{ src: "../icon-512.png", sizes: "512x512", type: "image/png" }] }); } catch {}
    } else { nowB.textContent = "Möbius Bar"; nowS.textContent = "mini player"; $(".vsong").textContent = songs.length ? "Pick a song first" : "Add a song first"; }
  }

  // ── Playback through the analyser (local files can be measured) ────
  let actx = null, an = null, recDest = null;
  const freq = new Uint8Array(512), wave = new Uint8Array(1024);
  function graph() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const src = actx.createMediaElementSource(player);
        an = actx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = .78;
        src.connect(an); an.connect(actx.destination);
        if (actx.createMediaStreamDestination) { recDest = actx.createMediaStreamDestination(); an.connect(recDest); }
      } catch { actx = null; an = null; }
    }
    if (actx && actx.state === "suspended") actx.resume().catch(() => {});
  }
  function play(i) {
    if (!songs.length) { picker.click(); return; }
    graph();
    cur = (i + songs.length) % songs.length;
    player.src = srcOf(songs[cur]);
    player.play().catch(() => {});
    kick(); mark();
  }
  function next(step = 1) {
    if (!songs.length) return;
    if (state.shuffle && songs.length > 1) { let n; do { n = Math.floor(Math.random() * songs.length); } while (n === cur); play(n); }
    else play(cur + step);
  }
  big.addEventListener("click", () => {
    if (!songs.length) { picker.click(); return; }
    graph();
    if (cur < 0) { play(state.shuffle ? Math.floor(Math.random() * songs.length) : 0); return; }
    if (player.paused) player.play().catch(() => {}); else if (!rec) player.pause();
  });
  picker.addEventListener("change", () => { const f = [...picker.files]; picker.value = ""; if (f.length) addFiles(f); });
  $(".add").addEventListener("click", () => picker.click());
  player.addEventListener("play", mark);
  player.addEventListener("pause", mark);
  player.addEventListener("ended", () => {
    if (rec) { stopRec(); return; }
    if (state.repeat) { player.currentTime = 0; player.play().catch(() => {}); } else next(1);
  });
  $(".prev").addEventListener("click", () => { if (rec) return; if (cur >= 0 && player.currentTime > 4) { player.currentTime = 0; return; } cur < 0 ? play(songs.length - 1) : next(-1); });
  $(".nxt").addEventListener("click", () => { if (rec) return; cur < 0 ? play(0) : next(1); });

  function renderToggles() {
    shuffleBtn.setAttribute("aria-pressed", String(state.shuffle));
    repeatBtn.setAttribute("aria-pressed", String(state.repeat));
    store.set("mobius-mini.state", state);
  }
  shuffleBtn.addEventListener("click", () => { state.shuffle = !state.shuffle; renderToggles(); });
  repeatBtn.addEventListener("click", () => { state.repeat = !state.repeat; renderToggles(); });
  if ("mediaSession" in navigator) {
    const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    set("play", () => player.play()); set("pause", () => { if (!rec) player.pause(); });
    set("nexttrack", () => { if (!rec) next(1); }); set("previoustrack", () => { if (!rec) next(-1); });
  }

  // ── Pages: Play | Songs | Video ────────────────────────────────────
  const navBtns = [...document.querySelectorAll(".nav button")];
  function go(p) { page = p; rail.style.setProperty("--p", p); navBtns.forEach((b, i) => b.setAttribute("aria-current", String(i === p))); }
  navBtns.forEach(b => b.addEventListener("click", () => go(+b.dataset.p)));
  stage.addEventListener("scroll", () => { stage.scrollLeft = 0; stage.scrollTop = 0; });
  let sx = null;
  stage.addEventListener("pointerdown", e => { sx = e.target.closest(".list") ? null : [e.clientX, e.clientY]; });
  stage.addEventListener("pointerup", e => {
    if (!sx) return; const dx = e.clientX - sx[0], dy = e.clientY - sx[1]; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(Math.max(0, Math.min(2, page + (dx < 0 ? 1 : -1))));
  });

  // ── Lights + wave: one painter for the screen and for the video ────
  const MOODS = [
    { pal: [[193, 18, 31], [255, 204, 0], [10, 79, 214], [224, 102, 26]], rays: 1, beams: 0, speed: .35 },   // Ovi skin
    { pal: [[255, 45, 40], [255, 206, 0], [255, 110, 0], [150, 70, 255]], rays: 0, beams: 0, speed: .45 },   // lava
    { pal: [[255, 45, 40], [255, 206, 0], [170, 80, 255], [10, 120, 255]], rays: 0, beams: 1, speed: .8 },   // disco
    { pal: [[123, 30, 46], [193, 18, 31], [201, 138, 0], [60, 20, 40]], rays: 1, beams: 0, speed: .22 },     // dark red, elegant
    { pal: [[255, 0, 130], [180, 90, 255], [255, 225, 60], [0, 215, 255]], rays: 0, beams: 1, speed: .6 },   // neon

  const bg = $("#bg"), bx = bg.getContext("2d"), fx = $("#fx"), fxc = fx.getContext("2d");

  const lerp = (a, b, t) => a + (b - a) * t, sm = t => t * t * (3 - 2 * t);

  const seeds = Array.from({ length: 8 }, () => [Math.random(), Math.random(), Math.random(), Math.random()]);
  function kick() { moodAt = clock - 999; }
  let clock = 0, last = performance.now() / 1000, ph = 0, cph = 0, rot = 0, pulse = 0, level = 0, bassAvg = 0, lastBeat = 0;

  function color(x) {

  function frame(ms) {

      let m; do { m = MOODS[Math.floor(Math.random() * MOODS.length)]; } while (m === to);
      from = to; to = m; blendAt = clock;
    }
    mt = sm(Math.min(1, (clock - blendAt) / 4));
    const live = an && !player.paused && actx && actx.state === "running";
    if (live) {
      an.getByteFrequencyData(freq); an.getByteTimeDomainData(wave);
      let s = 0; for (let i = 0; i < freq.length; i++) s += freq[i];
      level = lerp(level, s / freq.length / 255, .2);
      let bass = 0; for (let i = 1; i < 8; i++) bass += freq[i]; bass /= 7;

    // the screen
    paintField(bx, 160);
    fxc.clearRect(0, 0, W, H);

    big.style.setProperty("--pl", pulse.toFixed(3));
    big.style.setProperty("--glow", rgba(glow, .9));
    const d = player.duration; ringDone.style.strokeDashoffset = (cur >= 0 && d > 0 && isFinite(d)) ? (100 - 100 * player.currentTime / d).toFixed(2) : "100";

  }
  requestAnimationFrame(frame);

  // ── Video: record the song with its lights, 16:9 or 9:16 ───────────
  const vc = document.createElement("canvas"), vx = vc.getContext("2d");
  let rec = null, recBlob = null, recName = "", wake = null;
  const fmtT = s => !isFinite(s) || s < 0 ? "0:00" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  function fitText(ctx, text, max, size, weight) {
    let s = size; ctx.font = weight + " " + s + "px Montserrat, 'Helvetica Neue', Arial, sans-serif";
    while (ctx.measureText(text).width > max && s > size * .45) { s -= 2; ctx.font = weight + " " + s + "px Montserrat, 'Helvetica Neue', Arial, sans-serif"; }
    return s;
  }
  function paintVideo() {
    const w = vc.width, h = vc.height, tall = h > w, k = Math.min(w, h) / 360;
    paintField(fc, 96);
    vx.save(); vx.imageSmoothingEnabled = true; vx.imageSmoothingQuality = "high";
    const S = Math.max(w, h) * 1.15; vx.drawImage(field, (w - S) / 2, (h - S) / 2, S, S); vx.restore();

    g.addColorStop(0, "rgba(11,6,20,0)"); g.addColorStop(1, "rgba(11,6,20,.5)"); vx.fillStyle = g; vx.fillRect(0, 0, w, h);
    paintRays(vx, w, h, w / 2, tall ? h * .38 : h * .4);
    paintWave(vx, w * .04, tall ? h * .58 : h * .6, w * .92, (tall ? h * .07 : h * .14), k * 1.6);
    // title and the bar's name
    const t = songs[cur] ? songs[cur].title : "Möbius Bar";
    vx.textAlign = "center"; vx.textBaseline = "middle"; vx.fillStyle = "#fff";
    vx.shadowColor = "rgba(0,0,0,.8)"; vx.shadowBlur = 14 * k;
    fitText(vx, t.toUpperCase(), w * .86, (tall ? 34 : 30) * k, 800);
    vx.fillText(t.toUpperCase(), w / 2, tall ? h * .24 : h * .2);
    vx.font = "600 " + (11 * k) + "px Montserrat, 'Helvetica Neue', Arial, sans-serif";
    if ("letterSpacing" in vx) vx.letterSpacing = (4 * k) + "px";
    vx.fillText("MÖBIUS BAR", w / 2, (tall ? h * .24 : h * .2) + 26 * k);
    if ("letterSpacing" in vx) vx.letterSpacing = "0px";
    // progress line and the maker's mark
    const d = player.duration, p = d > 0 && isFinite(d) ? player.currentTime / d : 0;
    vx.shadowBlur = 0; vx.fillStyle = "rgba(255,255,255,.22)"; vx.fillRect(w * .08, h - 30 * k, w * .84, 2 * k);
    vx.fillStyle = rgba(lift(color(cph * 2)), 1); vx.fillRect(w * .08, h - 30 * k, w * .84 * p, 2 * k);
    vx.font = "800 " + (8 * k) + "px Montserrat, 'Helvetica Neue', Arial, sans-serif"; vx.fillStyle = "rgba(255,255,255,.8)";
    if ("letterSpacing" in vx) vx.letterSpacing = (2.5 * k) + "px";
    vx.fillText("MADE BY OVI", w / 2, h - 16 * k);

  }
  const TYPES = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4;codecs=avc1.640028,opus", "video/mp4;codecs=avc1,opus", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  const pickType = () => (window.MediaRecorder && MediaRecorder.isTypeSupported ? TYPES.find(t => MediaRecorder.isTypeSupported(t)) : "") || "";
  function showBox(which) {
    $(".pick").hidden = which !== "pick"; $(".rec:not(.done-box)").hidden = which !== "rec"; $(".done-box").hidden = which !== "done";
    $(".recdot").hidden = which !== "rec";
  }
  async function startRec(shape) {
    if (rec) return;
    if (cur < 0 || !songs[cur]) { if (songs.length) play(0); else { go(1); picker.click(); return; } }
    if (!window.MediaRecorder || !vc.captureStream) { $(".vnote").textContent = "This browser can't record video. Try Chrome on Android or Safari on iPhone."; return; }
    graph();
    if (!recDest) { $(".vnote").textContent = "This browser can't record the sound. Try Chrome on Android or Safari on iPhone."; return; }

  $(".save").addEventListener("click", async () => {

    $(".vnote").textContent = "The song plays from the start and the video records the whole song, lights and wave included. Keep the screen on until it finishes."; });

  // ── MADE BY OVI badge: drag it anywhere (a short tap opens About) ─
  const badge = $(".badge"); let drag = null;
